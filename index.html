<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Media | Launches impossible to scroll past</title>
    <meta
      name="description"
      content="New Media is the creator-distribution studio for AI and tech companies. One brief, a network of creators your buyers already follow, and a launch on every feed that matters."
    />
    <meta name="theme-color" content="#fbfbfe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#07071a" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply a saved light/dark choice before first paint.
      try {
        var t = localStorage.getItem('nm-theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <meta property="og:title" content="New Media" />
    <meta property="og:description" content="Launches impossible to scroll past." />
    <meta property="og:type" content="website" />
    <!-- Swap to an absolute URL (https://yourdomain.com/og.png) once the domain is live. -->
    <meta property="og:image" content="./og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
